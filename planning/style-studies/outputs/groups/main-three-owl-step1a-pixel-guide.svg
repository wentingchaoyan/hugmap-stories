    .small{font:15px Arial,sans-serif;fill:#291712}
    .dim{fill:none;stroke:#7D2741;stroke-width:2}
    .face{fill:none;stroke:#FF511B;stroke-width:2}
    .guide{fill:none;stroke:#8D8380;stroke-width:1.5;stroke-dasharray:8 8;opacity:.75}
