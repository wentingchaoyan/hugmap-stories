<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HugMap キャラクター造形の検討記録</title>
  <style>
    :root { --paper:#f6f2ee; --card:#fffdfb; --ink:#332a27; --muted:#817773; --line:#ddd5d0; --orange:#ef6a3a; --wine:#8b294b; --yellow:#eabf45; --green:#63816e; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; }
    header { padding:48px max(24px,5vw) 28px; border-bottom:1px solid var(--line); background:rgba(255,253,251,.84); }
    h1 { margin:0 0 10px; font-size:clamp(26px,4vw,44px); letter-spacing:.02em; }
    header p { max-width:780px; margin:0; color:var(--muted); line-height:1.8; }
    .flow { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:28px 0 0; max-width:960px; }
    .flow div { position:relative; padding:12px 10px; border:1px solid var(--line); border-radius:12px; background:var(--card); font-size:13px; text-align:center; }
    .flow div:not(:last-child)::after { content:"→"; position:absolute; right:-10px; top:11px; z-index:2; color:var(--orange); font-weight:700; }
    nav { position:sticky; top:0; z-index:4; display:flex; gap:8px; padding:14px max(24px,5vw); overflow:auto; background:rgba(246,242,238,.94); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
    nav button { flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:9px 14px; cursor:pointer; }
    nav button[aria-pressed="true"] { border-color:var(--wine); background:var(--wine); color:white; }
    main { padding:32px max(24px,5vw) 80px; }
    section { margin:0 0 52px; scroll-margin-top:84px; }
    section h2 { margin:0 0 8px; font-size:25px; }
    section > p { margin:0 0 22px; color:var(--muted); line-height:1.7; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px; }
    article { display:flex; flex-direction:column; min-width:0; overflow:hidden; border:1px solid var(--line); border-radius:18px; background:var(--card); }
    article[hidden] { display:none; }
    .image-button { display:block; width:100%; padding:0; border:0; background:#faf7f4; cursor:zoom-in; }
    article img { display:block; width:100%; height:210px; object-fit:contain; background:#faf7f4; }
    .comparison-legend { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:1px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--line); }
    .comparison-legend span { min-width:0; padding:9px 6px; background:#faf7f4; text-align:center; }
    .comparison-legend strong { display:block; font-size:11px; line-height:1.35; }
    .comparison-legend small { display:block; margin-top:4px; color:var(--muted); font-size:9px; line-height:1.35; }
    .info { display:flex; flex:1; flex-direction:column; padding:16px; }
    .meta { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
    .number { color:var(--orange); font-size:12px; font-weight:800; letter-spacing:.08em; }
    .status { border:1px solid var(--line); border-radius:999px; padding:4px 8px; color:var(--muted); font-size:11px; }
    .status.current { border-color:#b8d0c0; color:#426451; background:#edf6f0; }
    .status.hold { border-color:#e3c3cd; color:var(--wine); background:#fbf0f4; }
    h3 { margin:0 0 8px; font-size:17px; line-height:1.5; }
    .note { margin:0 0 14px; color:var(--muted); font-size:13px; line-height:1.7; }
    code { display:block; margin-top:auto; overflow-wrap:anywhere; color:#8d837f; font-size:10px; line-height:1.5; }
    dialog { width:min(94vw,1200px); max-height:92vh; padding:0; border:0; border-radius:18px; background:var(--card); box-shadow:0 30px 90px rgba(40,25,20,.28); }
    dialog::backdrop { background:rgba(35,26,23,.7); }
    dialog img { display:block; width:100%; max-height:82vh; object-fit:contain; background:#faf7f4; }
    dialog button { position:absolute; top:12px; right:12px; width:40px; height:40px; border:1px solid var(--line); border-radius:50%; background:rgba(255,253,251,.94); font-size:22px; cursor:pointer; }
    @media (max-width:680px) { .flow { grid-template-columns:1fr; }.flow div:not(:last-child)::after { content:"↓"; top:auto; right:50%; bottom:-13px; } article img { height:190px; } .comparison-legend { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  </style>
</head>
<body>
  <header>
    <h1>キャラクター造形の検討記録</h1>
    <p>番号は完成度ではなく、判断を重ねた順番です。別系統の画風比較と現在の造形本流を分け、骨格、関わり方、識別性、誇張、配色の順に、何を残して何を見直したかを追えるようにしています。</p>
    <div class="flow" aria-label="制作工程"><div>画風を比較する</div><div>共通骨格を選ぶ</div><div>代表ポーズを選ぶ</div><div>性格差を確かめる</div><div>色を試す</div></div>
  </header>
  <nav aria-label="表示対象">
    <button data-filter="groups" aria-pressed="true">現在の造形</button>
    <button data-filter="handdrawn-line" aria-pressed="false">手描き線の検討</button>
    <button data-filter="style-options" aria-pressed="false">別系統の画風</button>
    <button data-filter="kotori" aria-pressed="false">ことり</button>
    <button data-filter="risu" aria-pressed="false">りす</button>
    <button data-filter="usagi" aria-pressed="false">うさぎ</button>
    <button data-filter="children" aria-pressed="false">人物</button>
  </nav>
  <main id="process"></main>
  <dialog id="viewer"><button aria-label="閉じる">×</button><img alt=""></dialog>
  <script>
    const characterSteps = [
      ["character-design-step-1-roughs", "比率とシルエットを比較する", "シリーズ共通の骨格を出発点に、種族と性格に必要な比率差だけを比較した。"],
      ["character-design-step-2-line-face-study", "線と顔の基準を探る", "比率を大きく変えず、線の揺れと顔パーツの高さ・間隔が印象へ与える差を確かめた。"],
      ["character-face-personality-exploration-labeled", "顔から性格が伝わるか確かめる", "観察や集中が怒り・悲しみ・困惑へ見えない範囲を探り、基本顔の方向を絞った。"],
      ["character-emotion-pose-combined", "顔と身体の反応を組み合わせる", "顔だけに性格を背負わせず、視線、手足、重心を合わせて関わり方を表した。"],
      ["character-design-prompt-b-step-1-emotional-roughs", "関わり方を8場面へ広げる", "相手の前で、近づく・待つ・気づく・働きかける瞬間を広げ、性格の核を探した。"],
      ["character-design-prompt-b-step-1-emotional-roughs-dialogue", "場面の言葉で役割を確認する", "各ポーズへ実際の声かけを重ね、姿勢と役割が同じ方向を向いているか確認した。"],
      ["facial-parts-catalog-v1", "顔をパーツへ分解する", "目、眉、口を部品として比較し、どの組み合わせがどの感情に向くか整理した。"],
      ["facial-parts-catalog-v2-simple", "顔を点と線まで削る", "小さな画面でも読み取れるよう、重複する線を減らして最小限の記号へ整理した。"],
      ["facial-parts-catalog-v3-handdrawn", "単純な顔へ手描き感を戻す", "簡略化した構造を維持しながら、揺れ、欠け、筆圧差で温度を加えた。"]
    ];
    const specs = {
      kotori:{ label:"ことり先生", desc:"聞く・返す・待つ。現在の代表候補は「聞く」。", files:["v1","v1","v2","v1","v1","v1","v1","v2","v3"] },
      risu:{ label:"りす先生", desc:"観察・試す・選び直す。現在の代表候補は「ひらめく」。STEP 01の第3案を固定造形とし、青＝外形、橙＝耳、赤紫＝顔パーツ位置のガイドを重ねている。", files:["v1","v1","v2","v1","v1","v1","v1","v2","v3"], overrides:{0:"outputs/characters/risu/01-risu-character-design-step-1-ratio-lock-guide-v1.png"} },
      usagi:{ label:"うさぎ先生", desc:"誘う・気づく・合わせる。現在の代表候補は「誘う」。", files:["v1","v1","v2","v1","v1","v1","v1","v2","v3"] }
    };
    const sections = [];
    Object.entries(specs).forEach(([key,spec]) => {
      const items=[];
      let number=1;
      characterSteps.forEach((step,index) => {
        const version=spec.files[index];
        const basename=step[0].startsWith("facial-parts") ? step[0] : `${step[0]}-${version}`;
        const defaultFile=`outputs/characters/${key}/${String(number).padStart(2,"0")}-${key}-${basename}.png`;
        items.push({n:number++, title:step[1], note:step[2], file:spec.overrides?.[index]||defaultFile});
        if(key==="usagi" && index===3) items.push({n:number++, title:"感情とポーズの再調整", note:"頭身変化を抑え、元の造形を維持して表情と動作を調整した。", file:`outputs/characters/usagi/${String(number-1).padStart(2,"0")}-usagi-character-emotion-pose-combined-v2.png`});
      });
      sections.push({key,label:spec.label,desc:spec.desc,items});
    });
    sections.unshift({key:"style-options",label:"別系統で画風の可能性を比べる",desc:"現在の造形を選ぶ前に、記号性、動き、素材感という異なる強みを比較した探索群。ここで形を決めず、STEP 05から別の造形本流を始めた。",items:[
      {n:1,title:"記号性を優先した方向",note:"表情を抑えた単純な形で、小画面の識別性と読み手が感情を受け取る余白を確かめた。",file:"outputs/groups/01-main-three-symbolic-pose-sheet-v1.png"},
      {n:2,title:"動きの明快さを優先した方向",note:"表情と手足を大きく動かし、出来事がすぐ伝わる利点と、先生が目立ちすぎる課題を確認した。",file:"outputs/groups/02-main-three-animated-pose-sheet-v1.png"},
      {n:3,title:"紙の素材感を優先した方向",note:"切り紙や色の重なりが生む絵本らしい温度と、小画面で素材感が弱まる課題を比較した。",file:"outputs/groups/03-main-three-collage-pose-sheet-v1.png"},
      {n:4,title:"記号性に小さな動きを加える方向",note:"単純な形を保ったまま、反復する仕草で性格を見せられるか試した。",file:"outputs/groups/04-main-three-playful-graphic-symbol-pose-sheet-v1.png"}
    ]},{key:"groups",label:"現在の造形を選び、役割へつなげる",desc:"代表的なアニメーション表現から造形原理を抽出して比較し、共通骨格、関わり方、識別性、性格の誇張、配色の順で具体化した本流。固有作品のキャラクターは写さず、比率、線、目、手足、シルエットの設計差だけを判断材料にしている。",items:[
      {stepLabel:"REFERENCE 応用",title:"頭部形状を現在の三人へ適用する",note:"添付された三人の造形、服、ポーズを固定し、頭部だけを横方向に比較。各行は、上＝うさぎ先生、中＝ことり先生、下＝りす先生。最右列は、うさぎ＝丸＋下側の頬、ことり＝頬を膨らませない縦長の卵形、りす＝縦楕円＋短く前へ出る口元としている。",file:"outputs/groups/05b-main-three-head-shape-application-comparison-v1.png",legend:'<span><strong>正円</strong><small>幼い・無垢・親しみ</small></span><span><strong>縦長の楕円</strong><small>静か・繊細・慎重</small></span><span><strong>頬を出した形</strong><small>温かい・社交的・安心</small></span><span><strong>角の丸い四角</strong><small>実務的・安定・信頼</small></span><span><strong>役割別の推奨形</strong><small>固有性と役割を優先</small></span>',status:"実キャラ比較",statusClass:"hold"},
      {n:5,stepLabel:"STEP 05B",title:"比較から共通骨格の推奨案を選ぶ",note:"従来案では各行の第3案を推奨。新しい4系統の比較を踏まえ、共通骨格は単一作品へ寄せず、幾何学的な識別性、外線と内線の差、非対称なシルエット、控えめな眉・まぶた演技を組み合わせる。うさぎの耳、りすの安定した身体、ことりの頭身差は維持する。",file:"outputs/groups/05-main-three-character-design-step-1-unified-v2.png",status:"暫定選定",statusClass:"current"},
      {n:6,title:"役割を表す代表ポーズを選ぶ",note:"ことり2「聞く」、りす4「ひらめく」、うさぎ1「誘う」を推奨。骨格の次に、各先生が相手へどう関わるかを選んだ。",file:"outputs/groups/06-main-three-emotional-roughs-dialogue-overview-v1.png",status:"推奨選定",statusClass:"current"},
      {n:7,title:"りすの見分けやすさを見直す",note:"3案が似て見えたため、観察する、工夫する、提案するの違いが身体から読めるよう選択肢を作り直した。",file:"outputs/groups/07-main-three-consultation-group-pose-options-v2.png"},
      {n:8,title:"性格をどこで誇張するか比べる",note:"ことりは「小さなサインを聞き、返事を待つ慎重さ」、りすは「観察からひらめき、すぐ試したくなる好奇心」、うさぎは「先に誘い、相手へ合わせ直す快活さ」を表現。顔、翼・しっぽ・耳、重心のどこを強めると各性格が伝わるか比較した。ポーズ差へ偏ったため、正式案ではなく判断材料として残す。",file:"outputs/groups/08-main-three-prompt-b-step-2-personality-exaggeration-v1.png",status:"検討資料"},
      {n:9,title:"選定ポーズを共通骨格に揃えて配色する",note:"STEP 05の推奨骨格へ頭身・胴体幅・手足の大きさを合わせ、ことり＝黄、りす＝橙、うさぎ＝白とワイン紫を適用。りすは鼻と口の周囲だけに白いマズルを加え、顔の識別性も比較している。",file:"outputs/groups/09-main-three-selected-emotional-poses-color-study-v2.png",status:"現在地",statusClass:"current"}
    ]});
    sections.push({key:"handdrawn-line",label:"手描き線の揺れと崩し方を比べる",desc:"整った造形を保ちながら、線の揺れ、筆圧差、途切れ、重ね描き、身体の非対称をどこまで加えると温度が生まれるかを比較した追加検討。",items:[
      {stepLabel:"REFERENCE",title:"線の表情マップ",note:"曲率、太さ、揺れ、角、強弱を、暖かい・冷たい・可愛い・元気・手仕事・緊張感の6方向で整理した判断基準。",file:"outputs/handdrawn-line-study/reference-line-expression-map.svg",status:"基準"},
      {n:1,title:"鉛筆の手仕事感を強める",note:"5体の構成を維持し、鉛筆の揺れ、線圧のむら、かすれ、重ね描きを加えた。",file:"outputs/handdrawn-line-study/01-rabbit-pencil-rustic.png"},
      {n:2,title:"一発描きのペン線へ置き換える",note:"太く不均一な線、省略した手足、少し困った表情で、素朴な愛嬌を試した。",file:"outputs/handdrawn-line-study/02-rabbit-loose-pen.png"},
      {n:3,title:"性格ポーズへ線だけを適用する",note:"6つの性格とポーズを維持したまま、整った輪郭へ手描き線を加えた初期案。線幅以外の差が弱い課題が残った。",file:"outputs/handdrawn-line-study/03-rabbit-personality-clean.png",status:"初期案"},
      {n:4,title:"身体の重心まで崩して性格を出す",note:"輪郭だけでなく、左右差、手足の省略、姿勢の傾き、身振りを変えて性格差を強めた。",file:"outputs/handdrawn-line-study/04-rabbit-personality-loose.png",status:"方向性"},
      {n:5,title:"ことりの8ポーズへ展開する",note:"丸い素体の反復を避け、頭身、翼、足、重心をポーズごとに描き分けた。",file:"outputs/handdrawn-line-study/05-bird-gesture-loose.png"},
      {n:6,title:"りすの8動作へ展開する",note:"作業着と渦巻きの尻尾を保ち、動作に合わせて姿勢、手、体型の揺れを加えた。",file:"outputs/handdrawn-line-study/06-squirrel-action-loose.png"},
      {n:7,title:"3種の比較表へ控えめに適用する",note:"共通骨格を優先したため、元画像との差が線の太さへ偏った案。",file:"outputs/handdrawn-line-study/07-unified-study-subtle.png",status:"控えめ"},
      {n:11,title:"線の崩れをもう一段強める",note:"中間的な造形を維持し、途切れ、重なり、不完全な接続、描き直し跡を強めた現在の比較候補。",file:"outputs/handdrawn-line-study/11-unified-study-line-pass-2.png",status:"現在地",statusClass:"current"}
    ]});
    sections.push({key:"children",label:"人物との画風統一",desc:"動物だけが目立たないよう、子どもの描き方と同一画面での相性を比較した。",items:[
      {n:1,title:"人物の記号型",note:"小サイズの読みやすさを確認。",file:"outputs/children/01-child-symbolic-study-v1.png"},
      {n:2,title:"人物のキャラクター型",note:"感情と出来事の明快さを確認。",file:"outputs/children/02-child-animated-study-v1.png"},
      {n:3,title:"人物の水彩型",note:"生活場面の温度と背景量を確認。",file:"outputs/children/03-child-watercolor-life-study-v1.png"},
      {n:4,title:"人物の線画型",note:"思考、時間、余白を表現できる現在の第一候補。",file:"outputs/children/04-child-line-sketch-study-v1.png",status:"第一候補",statusClass:"current"},
      {n:5,title:"子ども＋ことりの統一",note:"人物と動物を同じ線の密度へ近づけた初期試作。",file:"outputs/children/05-boy-kotori-unified-style-v1.png"},
      {n:6,title:"人物を動物側へ合わせる",note:"動物の画風へ人物を寄せた場合の違和感を比較。",file:"outputs/children/06-boy-matched-to-animal-style-v2.png"}
    ]});

    const root=document.getElementById("process");
    sections.forEach(section=>{
      const node=document.createElement("section"); node.dataset.section=section.key;
      node.innerHTML=`<h2>${section.label}</h2><p>${section.desc}</p><div class="grid"></div>`;
      const grid=node.querySelector(".grid");
      section.items.forEach(item=>{
        const card=document.createElement("article"); card.dataset.category=section.key;
        const status=item.status||"探索";
        const stepLabel=item.stepLabel||`STEP ${String(item.n).padStart(2,"0")}`;
        card.innerHTML=`<button class="image-button" data-src="${item.file}" aria-label="${item.title}を拡大"><img src="${item.file}" alt="${item.title}" loading="lazy"></button>${item.legend?`<div class="comparison-legend" aria-label="頭部形状が与える印象">${item.legend}</div>`:""}<div class="info"><div class="meta"><span class="number">${stepLabel}</span><span class="status ${item.statusClass||""}">${status}</span></div><h3>${item.title}</h3><p class="note">${item.note}</p><code>${item.file.split("/").pop()}</code></div>`;
        grid.appendChild(card);
      });
      root.appendChild(node);
    });

    document.querySelectorAll("nav button").forEach(button=>button.addEventListener("click",()=>{
      const filter=button.dataset.filter;
      document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-pressed",String(b===button)));
      document.querySelectorAll("section").forEach(section=>section.hidden=section.dataset.section!==filter);
    }));
    document.querySelectorAll("section").forEach(section=>section.hidden=section.dataset.section!=="groups");
    const viewer=document.getElementById("viewer"), viewerImage=viewer.querySelector("img");
    document.addEventListener("click",event=>{ const button=event.target.closest(".image-button"); if(!button)return; viewerImage.src=button.dataset.src; viewerImage.alt=button.querySelector("img").alt; viewer.showModal(); });
    viewer.querySelector("button").addEventListener("click",()=>viewer.close());
    viewer.addEventListener("click",event=>{ if(event.target===viewer) viewer.close(); });
  </script>
</body>
</html>
